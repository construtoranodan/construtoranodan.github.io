    .heading-summary span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; }

    // ==========================================
    // LÓGICA DE LOGIN SEGURO E INTEGRAÇÃO GOOGLE
    // ==========================================
    let currentUser = null;

function decodeJwtResponse(token) {
    let base64Url = token.split('.')[1];
    let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
}

function checkSession() {
    const savedSession = localStorage.getItem('NODAN_SESSION');
    if (savedSession) {
        try {
            currentUser = JSON.parse(savedSession);
            document.getElementById('login-overlay').classList.add('hidden');
            if (typeof loadDataFromGoogle === 'function') {
                loadDataFromGoogle();
            }
        } catch(e) {
            localStorage.removeItem('NODAN_SESSION');
        }
    }
}

function handleCredentialResponse(response) {
    const responsePayload = decodeJwtResponse(response.credential);
    const email = responsePayload.email;

    fetch(GOOGLE_SCRIPT_URL + "?action=login&email=" + encodeURIComponent(email))
        .then(r => r.json())
        .then(data => {
            console.log("Resposta do Servidor:", data); 
            if (data.authorized) {
                const sessionData = {
                    authorized: true,
                    email: email,
                    nome: data.nome,
                    nivel: data.nivel,
                    timestamp: new Date().getTime()
                };
                localStorage.setItem('NODAN_SESSION', JSON.stringify(sessionData));
                
                document.getElementById('login-overlay').classList.add('hidden');
                
                if (typeof loadDataFromGoogle === 'function') {
                    loadDataFromGoogle();
                }
            } else {
                alert("Acesso negado para o e-mail: " + email);
            }
        })
        .catch(error => {
            console.error("Erro na comunicação:", error);
            alert("Erro ao conectar com o servidor.");
        });
}

        docs: driveDocs[unit.id] || ""
      };
    }

    function formatDate(value) {
      if (!value) return "Não informado";
      const parts = value.split("-");
      if (parts.length !== 3) return value;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatCurrency(number) {
      return Number(number || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function parseNumericRent(rentStr) {
      if (!rentStr) return "";
      const cleaned = rentStr.replace(/[^\d,]/g, "").replace(",", ".");
      const val = parseFloat(cleaned);
      return isNaN(val) ? "" : val.toFixed(2);
    }

    function getStatus(id) {
      if (id <= 12) return { label: "Contrato cadastrado", kind: "contract" };
      if (id === 13) return { label: "Condomínio", kind: "condo" };
      return { label: "Imóvel próprio", kind: "owned" };
    }

    function infoField(label, value, wide = false) {
      const shownValue = value === "" || value == null ? "Não informado" : value;
      return `
        <div class="info-field${wide ? " wide" : ""}">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(shownValue)}</strong>
        </div>
      `;
    }

    function meterItem(label, value, iconName) {
      return `
        <div class="meter-item">
          <span class="meter-icon">${icon(iconName, 16)}</span>
          <div>
            <span>${escapeHtml(label)}</span>
            <strong>${escapeHtml(value || "Não informado")}</strong>
          </div>
        </div>
      `;
    }

    function renderWelcome() {

            <div class="welcome-preview" aria-label="Resumo do cadastro">

              </div>

              <div class="preview-stats">
                <div class="preview-stat">
                  <strong>15</strong>
                  <span>unidades</span>
                </div>
                <div class="preview-stat">
                  <strong>06</strong>
                  <span>empreendimentos</span>
                </div>
                <div class="preview-stat">
                  <strong>12</strong>
                  <span>cadastros de inquilino</span>
                </div>
              </div>

              <div class="preview-feature">
                <div class="preview-feature-icon">${icon("building", 22)}</div>
                <div>
                  <strong>Informação a um clique</strong>
                  <span>Detalhes, inquilino, documentos e pagamentos por unidade.</span>
                </div>
              </div>

              <div class="preview-pills">
                <span>Endereços</span>
                <span>Contas dos imóveis</span>
                <span>Contratos</span>

            </div>
          </section>

          <footer class="welcome-footer">
            <span>© Construtora NODAN</span>
            <span>Dados administrativos: mantenha este app em ambiente protegido.</span>
          </footer>

    }

    function renderShell(content) {
      const isDetail = state.screen === "detail";
      const pageName = isDetail ? "Ficha do imóvel" : "Carteira de imóveis";

      return `
        <div class="app-shell">
          <aside class="sidebar">
            <div class="sidebar-brand">
              <div class="sidebar-logo-box">${logoMarkup()}</div>
              <div class="sidebar-brand-caption">Gestão patrimonial</div>
            </div>

            <div class="sidebar-section-label">Menu principal</div>
            <button class="nav-item active" data-action="go-list">
              ${icon("building", 19)}
              <span>Imóveis</span>
              <span class="nav-count">15</span>
            </button>

                <div class="sidebar-note-title">
                  ${icon("shield", 15)}
                  <span>Acesso administrativo</span>
                </div>
                <p>Os dados ficam incorporados neste app. Evite compartilhar uma versão pública.</p>

          <main class="main-area">

    function renderList() {
      const filterButtons = [
        `<button class="filter-chip" data-action="filter-group" data-group-filter="all">
          Todos <span>${units.length}</span>
        </button>`,
        ...groups.map(group => {
          const count = units.filter(unit => unit.groupId === group.id).length;
          return `
            <button class="filter-chip" data-action="filter-group" data-group-filter="${group.id}">
              ${escapeHtml(group.name)} <span>${count}</span>
            </button>
          `;
        })
      ].join("");

      const groupSections = groups.map(group => {
        const groupUnits = units.filter(unit => unit.groupId === group.id);
        const cards = groupUnits.map(unit => {
          const tenant = tenants[unit.id];
          const status = getStatus(unit.id);
          const searchText = normalize([
            unit.name, unit.detail, unit.address, group.name, tenant ? tenant.name : ""
          ].join(" "));

          return `
            <a class="unit-card"
              href="#imovel-${unit.id}"
              data-action="open-unit"
              data-id="${unit.id}"
              data-group="${group.id}"
              data-search="${escapeHtml(searchText)}"
              aria-label="Abrir ficha de ${escapeHtml(unit.name)}">

              ${photoMarkup(unit.photo || group.cover, unit.name, "unit-photo-frame")}

              <div class="unit-card-body">
                <div class="unit-card-topline">
                  <span class="status-tag ${status.kind}">${escapeHtml(status.label)}</span>
                  <span class="unit-card-arrow">${icon("chevronRight", 15)}</span>
                </div>

                <h3>${escapeHtml(unit.name)}</h3>
                <p class="unit-card-location">${escapeHtml(group.name)}</p>

                <div class="unit-card-footer">
                  <span>Valor de aluguel informado</span>
                  <strong>${escapeHtml(unit.rent || "Não informado")}</strong>
                </div>
              </div>
            </a>
          `;
        }).join("");

        return `
          <section class="group-section" data-group-section="${group.id}">
            <div class="group-heading">
              ${photoMarkup(group.cover, group.name, "group-photo-frame")}
              <div class="group-heading-copy">
                <div class="group-overline">Empreendimento ${String(group.id).padStart(2, "0")}</div>
                <h2>${escapeHtml(group.name)}</h2>
                <p>${groupUnits.length} ${groupUnits.length === 1 ? "unidade" : "unidades"}</p>
              </div>
            </div>
            <div class="unit-grid">${cards}</div>
          </section>
        `;
      }).join("");

      return `
        <section class="page-heading">
          <div>
            <div class="eyebrow">Painel NODAN</div>
            <h1>Imóveis</h1>
            <p>Selecione uma unidade para consultar seus dados, inquilino, pagamentos e documentos.</p>
          </div>

          <div class="heading-summary">
            <div class="heading-summary-icon">${icon("building", 21)}</div>
            <div>
              <strong>15 unidades</strong>
              <span>em 6 empreendimentos</span>
            </div>
          </div>
        </section>

        <div class="list-tools">
          <label class="search-box" for="property-search">
            ${icon("search", 18)}
            <input id="property-search" type="search"
              placeholder="Buscar imóvel, empreendimento ou inquilino..."
              value="${escapeHtml(state.query)}"
              autocomplete="off">
          </label>
          <div class="results-count" id="results-count">15 unidades</div>
        </div>

        <div class="filter-row">${filterButtons}</div>
        <div id="property-groups">${groupSections}</div>

        <div id="no-results" class="no-results" hidden>
          Nenhum imóvel encontrado. Tente outro nome ou empreendimento.
        </div>
      `;
    }

    function renderDetailsPanel(property) {
      const unit = property.unit;

      return `
        <div class="panel-grid">
          <section class="panel">
            <div class="panel-heading">
              <div class="panel-icon">${icon("location", 19)}</div>
              <div>
                <h2>Identificação e endereço</h2>
                <p>Dados cadastrados para esta unidade.</p>
              </div>
            </div>

            <div class="info-field-grid">
              ${infoField("Unidade", unit.name)}
              ${infoField("Detalhamento cadastrado", unit.detail)}
              ${infoField("Empreendimento", property.group.name)}
              ${infoField("Valor do aluguel", unit.rent)}
              ${infoField("Endereço", unit.address, true)}
            </div>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <div class="panel-icon">${icon("wallet", 19)}</div>
              <div>
                <h2>Contas e cadastros</h2>
                <p>Referências informadas para o imóvel.</p>
              </div>
            </div>

            <div class="meters-grid">
              ${meterItem("IPTU", unit.iptu, "file")}
              ${meterItem("Água", unit.water, "droplet")}
              ${meterItem("AM Energia", unit.energy, "bolt")}
              ${meterItem("Âmbar", unit.ambar, "bolt")}
            </div>
          </section>
        </div>

        <div class="panel-footnote">
          ${icon("info", 16)}
          <span>Valores e identificadores exibidos conforme os dados fornecidos. “Não informado” indica um campo que estava vazio na tabela.</span>
        </div>
      `;
    }

    function getInitials(name) {
      return String(name || "")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part.charAt(0))
        .join("")
        .toUpperCase();
    }

    function renderTenantPanel(property) {
      const tenant = property.tenant;

      if (!tenant || tenant.name === "Condomínio" || tenant.name === "Imóvel próprio") {
        const isCondo = tenant && tenant.name === "Condomínio";
        const title = isCondo ? "Unidade cadastrada como condomínio" : "Imóvel próprio";
        const message = isCondo
          ? "A tabela identifica esta unidade como condomínio. Não foram informados dados pessoais ou contrato de inquilino."
          : "Esta unidade está identificada como imóvel próprio. Não há dados de inquilino cadastrados para ela.";

        return `
          <section class="special-record">
            <div class="special-record-icon">${icon(isCondo ? "building" : "user", 25)}</div>
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(message)}</p>
          </section>
        `;
      }

      return `
        <section class="panel tenant-panel">
          <div class="tenant-profile">
            <div class="tenant-avatar">${escapeHtml(getInitials(tenant.name))}</div>
            <div>
              <div class="eyebrow">Inquilino cadastrado</div>
              <h2>${escapeHtml(tenant.name)}</h2>
              <p>Vinculado a ${escapeHtml(property.unit.name)} · ${escapeHtml(property.group.name)}</p>
            </div>
          </div>

          <div class="tenant-fields">
            ${infoField("CPF", tenant.cpf)}
            ${infoField("Telefone", tenant.phone)}
            ${infoField("Dia de pagamento", tenant.dueDay ? `Dia ${tenant.dueDay} de cada mês` : "")}
            ${infoField("Início do contrato", formatDate(tenant.start))}
            ${infoField("Renovação", formatDate(tenant.renewal))}
            ${infoField("Término", formatDate(tenant.end))}
          </div>

          <div class="privacy-note">
            ${icon("shield", 16)}
            <span>Esta ficha contém dados pessoais. Restrinja o acesso ao app e aos arquivos que o acompanham.</span>
          </div>
        </section>
      `;
    }

    function isHttpUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (e) {
        return false;
      }
    }

    function renderDocumentsPanel(property) {
      const url = property.docs;

      if (!url || !isHttpUrl(url)) {
        return `
          <section class="empty-documents">
            <div class="document-icon">${icon("folder", 25)}</div>
            <h2>Nenhum documento vinculado</h2>
            <p>Não há um link de documentos cadastrado para esta unidade.</p>
          </section>
        `;
      }

      return `
        <section class="documents-panel">
          <div class="document-card">
            <div class="document-icon">${icon("folder", 25)}</div>
            <div class="document-copy">
              <h2>Documentos de ${escapeHtml(property.unit.name)}</h2>
              <p>Abra o link cadastrado para consultar os documentos desta unidade.</p>
            </div>
            <a class="primary-button" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">
              Abrir documentos
              ${icon("external", 15)}
            </a>
          </div>

          <p class="documents-note">
            Os links foram inseridos conforme a tabela fornecida. Substitua os endereços de exemplo pelos links reais das pastas no Google Drive.
          </p>
        </section>
      `;
    }

    function renderPaymentsPanel(property) {
      if (property.unit.id > 12) {
        return `
          <section class="special-record">
            <div class="special-record-icon">${icon("building", 25)}</div>
            <h2>Imóvel próprio / Condomínio</h2>
            <p>Esta unidade está identificada como patrimônio próprio ou condomínio. Não possui cobrança de aluguel nem registro de pagamentos de inquilino.</p>
          </section>
        `;
      }

      const allPayments = loadPayments();
      const unitPayments = allPayments.filter(p => p.unitId === property.unit.id);

      const currentYear = new Date().getFullYear();
      const yearsSet = new Set([currentYear - 1, currentYear, currentYear + 1]);
      unitPayments.forEach(p => yearsSet.add(Number(p.refYear)));
      const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);

      const activeYear = Number(state.paymentYear);
      const activeMonth = state.paymentMonth;

      const yearPayments = unitPayments.filter(p => Number(p.refYear) === activeYear);
      const totalYearAmount = yearPayments.reduce((acc, p) => acc + Number(p.amount || 0), 0);
      const distinctMonthsWithPayment = new Set(yearPayments.map(p => Number(p.refMonth))).size;

      const filteredPayments = activeMonth === "all"
        ? yearPayments
        : yearPayments.filter(p => Number(p.refMonth) === Number(activeMonth));

      filteredPayments.sort((a, b) => new Date(b.paymentDate) - new Date(a.paymentDate));

      const todayISO = new Date().toISOString().split("T")[0];
      const currentMonthIndex = new Date().getMonth() + 1;
      const defaultRentValue = parseNumericRent(property.unit.rent);

      const monthFilterButtons = [
        `<button class="month-chip${activeMonth === "all" ? " active" : ""}"
          data-action="filter-payment-month" data-month="all">
          Todos os meses
        </button>`,
        ...MONTHS_SHORT.map((shortName, idx) => {
          const monthNum = idx + 1;
          const hasPay = yearPayments.some(p => Number(p.refMonth) === monthNum);
          const isSelected = String(activeMonth) === String(monthNum);
          return `
            <button class="month-chip${isSelected ? " active" : ""}${hasPay ? " has-payment" : ""}"
              data-action="filter-payment-month" data-month="${monthNum}">
              ${hasPay ? '<span class="month-chip-badge"></span>' : ''}
              ${shortName}
            </button>
          `;
        })
      ].join("");

      let tableRows = "";
      if (filteredPayments.length === 0) {
        tableRows = `
          <tr>
            <td colspan="5" class="empty-report">
              Nenhum pagamento registrado para ${activeMonth === "all" ? "o ano de " + activeYear : MONTHS[Number(activeMonth) - 1] + " de " + activeYear}.
            </td>
          </tr>
        `;
      } else {
        tableRows = filteredPayments.map(p => `
          <tr>
            <td><strong>${escapeHtml(formatDate(p.paymentDate))}</strong></td>
            <td><span class="table-badge-month">${escapeHtml(MONTHS[Number(p.refMonth) - 1])} / ${escapeHtml(p.refYear)}</span></td>
            <td class="table-amount">${escapeHtml(formatCurrency(p.amount))}</td>
            <td style="color:#6d7f92">${escapeHtml(p.notes || "—")}</td>
            <td style="text-align:right">
              <button class="table-delete-btn" data-action="delete-payment" data-id="${p.id}" title="Excluir este lançamento e atualizar a planilha">
                Excluir
              </button>
            </td>
          </tr>
        `).join("");
      }

      return `
        <div class="payments-wrapper">
          <section class="payment-form-card">
            <div class="panel-heading" style="margin-bottom:0">
              <div class="panel-icon green">${icon("wallet", 20)}</div>
              <div>
                <h2>Registrar Pagamento Recebido</h2>
                <p>Anote o recebimento. O valor será gravado no app e atualizado na sua planilha do Google Drive na mesma hora.</p>
              </div>
            </div>

            <form id="payment-form">
              <div class="form-grid">
                <div class="form-group">
                  <label for="pay-date">Data do Recebimento</label>
                  <input type="date" id="pay-date" name="paymentDate" value="${todayISO}" required>
                </div>

                <div class="form-group">
                  <label for="pay-month">Mês de Referência</label>
                  <select id="pay-month" name="refMonth" required>
                    ${MONTHS.map((m, idx) => `
                      <option value="${idx + 1}" ${idx + 1 === currentMonthIndex ? "selected" : ""}>
                        ${m}
                      </option>
                    `).join("")}
                  </select>
                </div>

                <div class="form-group">
                  <label for="pay-year">Ano de Referência</label>
                  <select id="pay-year" name="refYear" required>
                    ${sortedYears.map(y => `
                      <option value="${y}" ${y === currentYear ? "selected" : ""}>${y}</option>
                    `).join("")}
                  </select>
                </div>

                <div class="form-group">
                  <label for="pay-amount">Valor Pago (R$)</label>
                  <input type="number" step="0.01" min="0" id="pay-amount" name="amount"
                    placeholder="Ex: 1660.00" value="${defaultRentValue}" required>
                </div>

                <div class="form-group" style="grid-column: 1 / -1">
                  <label for="pay-notes">Observação (Opcional - Ex: 1ª parcela de 2, Pix, etc.)</label>
                  <input type="text" id="pay-notes" name="notes" placeholder="Ex: Transferência Pix recebida à tarde">
                </div>
              </div>

              <div class="form-actions">
                <button type="submit" class="primary-button gold" id="btn-save-payment">
                  ${icon("check", 16)}
                  Registrar Pagamento
                </button>

                <div id="payment-save-status">
                  ${state.saveMessage ? `<span class="save-feedback">${icon("check", 15)} ${escapeHtml(state.saveMessage)}</span>` : ""}
                </div>
              </div>
            </form>
          </section>

          <section class="report-card">
            <div class="report-topline">
              <div>
                <h2 style="margin:0; font-size:16px; color:var(--ink)">Relatório Anual de Pagamentos</h2>
                <p style="margin:4px 0 0; color:var(--muted); font-size:11px">Histórico de quitação do ${escapeHtml(property.unit.name)}.</p>
              </div>

              <div class="year-selector">
                <label for="select-report-year">Ano:</label>
                <select id="select-report-year" data-action="change-payment-year">
                  ${sortedYears.map(y => `
                    <option value="${y}" ${y === activeYear ? "selected" : ""}>${y}</option>
                  `).join("")}
                </select>
              </div>
            </div>

            <div class="report-stats-grid">
              <div class="report-stat-box">
                <span>Total Recebido em ${activeYear}</span>
                <strong class="green">${formatCurrency(totalYearAmount)}</strong>
              </div>
              <div class="report-stat-box">
                <span>Meses com Pagamento</span>
                <strong>${distinctMonthsWithPayment} de 12 meses</strong>
              </div>
              <div class="report-stat-box">
                <span>Lançamentos no Ano</span>
                <strong>${yearPayments.length} registros</strong>
              </div>
            </div>

            <div class="month-filter-bar">${monthFilterButtons}</div>

            <div style="overflow-x:auto">
              <table class="payments-table">
                <thead>
                  <tr>
                    <th>Data Recebimento</th>
                    <th>Mês Ref.</th>
                    <th>Valor Pago</th>
                    <th>Observação</th>
                    <th style="text-align:right">Ações</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </section>

          <div class="sheet-sync-bar">
            <div class="sheet-sync-copy">
              ${icon("cloud", 18)}
              <span>Conexão ativa: lançamentos e exclusões são refletidos automaticamente na aba <strong>PAGAMENTOS</strong> do seu Google Drive.</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderPropertyDetail(property) {
      const unit = property.unit;
      const status = getStatus(unit.id);
      const imageSource = unit.photo || property.group.cover;
      const imageNote = unit.photo ? "Foto da unidade" : "Imagem do empreendimento";

      if (state.tab === "documentos") tabContent = renderDocumentsPanel(property);
      if (state.tab === "pagamentos") tabContent = renderPaymentsPanel(property);

      const tabs = [
        { id: "detalhes", label: "Detalhes", icon: "building" },
        { id: "inquilino", label: "Inquilino", icon: "user" },
        { id: "documentos", label: "Documentos", icon: "file" },
        { id: "pagamentos", label: "Pagamentos", icon: "wallet" }
      ];

      return `
        <section class="detail-view">
          <div class="detail-heading">
            <div>
              <div class="eyebrow">Ficha do imóvel · ID ${unit.id}</div>
              <h1>${escapeHtml(unit.name)}</h1>
              <p>${escapeHtml(property.group.name)} <span>· ${escapeHtml(unit.detail)}</span></p>
            </div>

            <button class="back-link" data-action="back">
              ${icon("arrowLeft", 16)}
              Todos os imóveis
            </button>
          </div>

          <div class="detail-cover">
            ${photoMarkup(imageSource, unit.name, "detail-photo-frame")}

            <div class="detail-cover-content">
              <div class="cover-topline">
                <span class="cover-status">${escapeHtml(status.label)}</span>
                <span class="cover-image-note">${escapeHtml(imageNote)}</span>
              </div>

              <div class="cover-bottomline">
                <div>
                  <span>Empreendimento</span>
                  <strong>${escapeHtml(property.group.name)}</strong>
                </div>
                <div class="cover-price">
                  <span>Valor de aluguel informado</span>
                  <strong>${escapeHtml(unit.rent || "Não informado")}</strong>
                </div>
              </div>
            </div>
          </div>

          <div class="tabs-wrap">
            <div class="tab-bar" role="tablist" aria-label="Informações do imóvel">
              ${tabs.map(tab => `
                <button class="tab-button${state.tab === tab.id ? " active" : ""}"
                  role="tab"
                  aria-selected="${state.tab === tab.id}"
                  data-action="change-tab"
                  data-tab="${tab.id}">
                  ${icon(tab.icon, 17)}
                  <span>${tab.label}</span>
                </button>
              `).join("")}
            </div>
          </div>

          <div class="tab-content" role="tabpanel">
            ${tabContent}
          </div>
        </section>
      `;
    }

    function render() {
      if (state.screen === "welcome") {
        app.innerHTML = renderWelcome();
        document.title = "NODAN | Gestão de Imóveis";
        return;
      }

      if (state.screen === "detail") {
        const property = getProperty(state.unitId);

        if (!property) {
          state.screen = "list";
          state.unitId = null;
          app.innerHTML = renderShell(renderList());
          applyFilters();
          return;
        }

        app.innerHTML = renderShell(renderPropertyDetail(property));
        document.title = `${property.unit.name} | NODAN`;
        return;
      }

      app.innerHTML = renderShell(renderList());
      document.title = "Imóveis | NODAN";
      applyFilters();
    }

    function syncCurrentRoute() {
      const depth = routeHistory.length - 1;
      const snapshot = { ...state, __routeDepth: depth };
      routeHistory[depth] = snapshot;

      if (historyEnabled) {
        try {
          history.replaceState(snapshot, "");
        } catch (e) {
          historyEnabled = false;
        }
      }
    }

    function navigate(nextState) {
      Object.assign(state, nextState);

      const snapshot = {
        ...state,
        __routeDepth: routeHistory.length
      };

      routeHistory.push(snapshot);

      if (historyEnabled) {
        try {
          history.pushState(snapshot, "");
        } catch (e) {
          historyEnabled = false;
        }
      }

      render();
      window.scrollTo(0, 0);
    }

    function goBack() {
      if (routeHistory.length <= 1) return;

      if (historyEnabled) {
        history.back();
      } else {
        routeHistory.pop();
        Object.assign(state, routeHistory[routeHistory.length - 1]);
        render();
        window.scrollTo(0, 0);
      }
    }

    function goToList() {
      if (state.screen === "list") return;

      if (state.screen === "detail" && routeHistory.length > 1) {
        goBack();
        return;
      }

      navigate({
        screen: "list",
        unitId: null,
        tab: "detalhes"
      });
    }

    window.addEventListener("popstate", event => {
      if (event.state && Number.isFinite(event.state.__routeDepth)) {
        const depth = event.state.__routeDepth;
        routeHistory = routeHistory.slice(0, depth + 1);
        Object.assign(state, event.state);
      } else {
        const welcomeState = {
          screen: "welcome",
          unitId: null,
          tab: "detalhes",
          query: "",
          groupFilter: "all",
          paymentYear: new Date().getFullYear(),
          paymentMonth: "all",
          saveMessage: "",
          __routeDepth: 0
        };
        routeHistory = [welcomeState];
        Object.assign(state, welcomeState);
      }

      render();
      window.scrollTo(0, 0);
    });

    function applyFilters() {
      const cards = Array.from(document.querySelectorAll(".unit-card"));
      const query = normalize(state.query);
      let visibleCount = 0;

      cards.forEach(card => {
        const matchesGroup =
          state.groupFilter === "all" ||
          card.dataset.group === String(state.groupFilter);

        const matchesQuery =
          !query || (card.dataset.search || "").includes(query);

        const visible = matchesGroup && matchesQuery;
        card.hidden = !visible;
        if (visible) visibleCount++;
      });

      document.querySelectorAll("[data-group-section]").forEach(section => {
        const hasVisibleCard = Boolean(section.querySelector(".unit-card:not([hidden])"));
        section.hidden = !hasVisibleCard;
      });

      const count = document.getElementById("results-count");
      if (count) {
        count.textContent = `${visibleCount} ${visibleCount === 1 ? "unidade" : "unidades"}`;
      }

      const noResults = document.getElementById("no-results");
      if (noResults) noResults.hidden = visibleCount > 0;

      document.querySelectorAll(".filter-chip").forEach(button => {
        const active = button.dataset.groupFilter === String(state.groupFilter);
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    app.addEventListener("click", event => {
      const control = event.target.closest("[data-action]");
      if (!control) return;

      const action = control.dataset.action;

      if (action === "enter") {
        navigate({ screen: "list", unitId: null, tab: "detalhes" });
      }

      if (action === "go-list") {
        goToList();
      }

      if (action === "back") {
        goBack();
      }

      if (action === "open-unit") {
        event.preventDefault();
        navigate({
          screen: "detail",
          unitId: Number(control.dataset.id),
          tab: "detalhes",
          saveMessage: ""
        });
      }

      if (action === "change-tab") {
        state.tab = control.dataset.tab;
        state.saveMessage = "";
        syncCurrentRoute();
        const currentScroll = window.scrollY;
        render();
        window.scrollTo(0, currentScroll);
      }

      if (action === "filter-group") {
        state.groupFilter = control.dataset.groupFilter;
        syncCurrentRoute();
        applyFilters();
      }

      if (action === "filter-payment-month") {
        state.paymentMonth = control.dataset.month;
        const currentScroll = window.scrollY;
        render();
        window.scrollTo(0, currentScroll);
      }

      if (action === "delete-payment") {
        const idToDelete = control.dataset.id;
        if (confirm("Deseja realmente excluir este lançamento? A exclusão será atualizada na planilha do Drive imediatamente.")) {
          
          const list = loadPayments().filter(p => String(p.id) !== String(idToDelete));
          savePayments(list); // Tira da tela na hora
          
          syncWithDrive({ id: idToDelete }, true); // Manda o comando pro Drive (true = exclusao)

          const currentScroll = window.scrollY;
          render();
          window.scrollTo(0, currentScroll);
        }
      }
    });

    app.addEventListener("change", event => {
      if (event.target.dataset.action === "change-payment-year") {
        state.paymentYear = Number(event.target.value);
        state.paymentMonth = "all";
        const currentScroll = window.scrollY;
        render();
        window.scrollTo(0, currentScroll);
      }
    });

    app.addEventListener("input", event => {
      if (event.target.id === "property-search") {
        state.query = event.target.value;
        syncCurrentRoute();
        applyFilters();
      }
    });

    app.addEventListener("submit", event => {
      if (event.target.id === "payment-form") {
        event.preventDefault();
        const prop = getProperty(state.unitId);
        if (!prop) return;

        const form = event.target;
        const paymentDate = form.paymentDate.value;
        const refMonth = Number(form.refMonth.value);
        const refYear = Number(form.refYear.value);
        const amount = parseFloat(form.amount.value) || 0;
        const notes = form.notes.value.trim();

        if (!paymentDate || !amount) {
          alert("Por favor, preencha a data e o valor pago.");
          return;
        }

        const newPayment = {
          id: "PAY_" + Date.now(),
          unitId: prop.unit.id,
          unitName: prop.unit.name,
          tenantName: prop.tenant ? prop.tenant.name : "Não informado",
          paymentDate,
          refMonth,
          refYear,
          amount,
          notes,
          action: "create"
        };

        const list = loadPayments();
        list.push(newPayment);
        savePayments(list); // Salva na tela na hora

        syncWithDrive(newPayment, false); // Envia para o google Drive na hora (false = novo pag)

        state.saveMessage = `Pagamento de ${formatCurrency(amount)} salvo com sucesso!`;
        state.paymentYear = refYear;
        state.paymentMonth = refMonth;

        const currentScroll = window.scrollY;
        render();
        window.scrollTo(0, currentScroll);

        setTimeout(() => {
          state.saveMessage = "";
          const statusElem = document.getElementById("payment-save-status");
          if (statusElem) statusElem.innerHTML = "";
        }, 4000);
      }
    });

    render();
  </script>
</body>
</html>
