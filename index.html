    const driveDocs = {

      5: "https://google.com", 6: "https://google.com", 7: "https://google.com", 8: "https://google.com",

    };

    const MONTHS = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    const MONTHS_SHORT = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
    const STORAGE_KEY_PAYMENTS = "NODAN_PAYMENTS_REGISTRY_V1";

    function loadPayments() { try { const r = localStorage.getItem(STORAGE_KEY_PAYMENTS); return r ? JSON.parse(r) : []; } catch(e) { return []; } }
    function savePayments(l) { try { localStorage.setItem(STORAGE_KEY_PAYMENTS, JSON.stringify(l)); } catch(e){} }
    function syncWithDrive(p) {
      const u = String(GOOGLE_SCRIPT_URL||"").trim();
      if (u && u.startsWith("http")) {
        fetch(u, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) }).catch(e => console.warn("Erro Drive:", e));
      }
    }

    const app = document.getElementById("app");
    const loginScreen = document.getElementById("login-screen");
    const loginStatus = document.getElementById("login-status");

    const state = { screen: "welcome", unitId: null, tab: "detalhes", query: "", groupFilter: "all", paymentYear: new Date().getFullYear(), paymentMonth: "all", saveMessage: "" };
    let routeHistory = [{ ...state, __routeDepth: 0 }];
    let historyEnabled = true;
    try { history.replaceState(routeHistory[0], ""); } catch(e) { historyEnabled = false; }

    function escapeHtml(v) { return String(v??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
    function normalize(v) { return String(v??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

    function icon(n, s=18) {
      const p = {
        building: '<path d="M4 21V5.5L12 2l8 3.5V21"/><path d="M2 21h20"/><path d="M9 21v-4h6v4"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M12 12h.01M16 12h.01"/>',
        search: '<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',
        arrowRight: '<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
        arrowLeft: '<path d="M19 12H5"/><path d="m11 18-6-6 6-6"/>',
        chevronRight: '<path d="m9 18 6-6-6-6"/>',

        bolt: '<path d="m13 2-3 9h7l-6 11 2-9H6l7-11Z"/>',

        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
        calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
        phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.4 2.7a2 2 0 0 1-.6 1.7L7.5 9.5a16 16 0 0 0 7 7l1.4-1.4a2 2 0 0 1 1.7-.6l2.7.4a2 2 0 0 1 1.7 2Z"/>',
        external: '<path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>',
        folder: '<path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 9h18"/>',
        info: '<circle cx="12" cy="12" r="10"/><path d="M12 11v5M12 8h.01"/>',
        shield: '<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
        logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>'
      };
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[n]||p.building}</svg>`;
    }

    function logoMarkup() { return `<span class="logo-mark"><img src="${escapeHtml(LOGO)}" alt="NODAN" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="logo-fallback" hidden>NODAN</span></span>`; }
    function getPhotoUrl(unitId, groupId, fallback) { return drivePhotos.units[String(unitId)] || drivePhotos.groups[String(groupId)] || fallback || ""; }
    function photoMarkup(src, alt, extraClass="") {
      const img = src ? `<img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" onload="this.closest('.photo-frame').classList.add('is-loaded')" onerror="this.remove()">` : "";
      return `<div class="photo-frame ${escapeHtml(extraClass)}"><div class="photo-fallback"><span class="fallback-icon">N</span><span class="fallback-label">${escapeHtml(alt)}</span><small>Imagem indisponível</small></div>${img}</div>`;
    }

    function getProperty(id) { const u = units.find(i=>i.id===Number(id)); return u ? { unit: u, group: groups.find(i=>i.id===u.groupId), tenant: tenants[u.id]||null, docs: driveDocs[u.id]||"" } : null; }
    function formatDate(v) { if(!v) return "Não informado"; const p = v.split("-"); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : v; }
    function formatCurrency(n) { return Number(n||0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
    function parseNumericRent(r) { if(!r) return ""; const v = parseFloat(r.replace(/[^\d,]/g,"").replace(",",".")); return isNaN(v) ? "" : v.toFixed(2); }
    function getStatus(id) { return id<=12 ? {label:"Contrato cadastrado", kind:"contract"} : (id===13 ? {label:"Condomínio", kind:"condo"} : {label:"Imóvel próprio", kind:"owned"}); }

    function infoField(label, value, wide=false) { return `<div class="info-field${wide?" wide":""}"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value===""||value==null?"Não informado":value)}</strong></div>`; }
    function meterItem(label, value, iconName) { return `<div class="meter-item"><span class="meter-icon">${icon(iconName,16)}</span><div><span>${escapeHtml(label)}</span><strong>${escapeHtml(value||"Não informado")}</strong></div></div>`; }
    function getInitials(name) { return String(name||"").trim().split(/\s+/).slice(0,2).map(p=>p.charAt(0)).join("").toUpperCase(); }
    function isAdmin() { return currentUser && currentUser.nivel === "admin"; }

    function renderWelcome() {
      return `<main class="welcome-screen"><header class="welcome-top"><div class="welcome-logo-box">${logoMarkup()}</div><div class="welcome-top-note">Portal de gestão imobiliária</div></header><section class="welcome-content"><div class="welcome-copy"><div class="welcome-kicker">Painel NODAN</div><h1>Seu patrimônio,<br><em>sob controle.</em></h1><p>Imóveis, informações de contratos, pagamentos e documentos organizados em um único lugar.</p><button class="welcome-cta" data-action="enter">Acessar imóveis ${icon("arrowRight",19)}</button><div class="welcome-caption">Uso administrativo · Visualização adaptada</div></div><div class="welcome-preview"><div class="preview-topline"><span>Visão geral</span><span>Carteira NODAN</span></div><div class="preview-stats"><div class="preview-stat"><strong>15</strong><span>unidades</span></div><div class="preview-stat"><strong>06</strong><span>empreendimentos</span></div><div class="preview-stat"><strong>12</strong><span>inquilinos</span></div></div><div class="preview-feature"><div class="preview-feature-icon">${icon("building",22)}</div><div><strong>Informação rápida</strong><span>Detalhes e histórico financeiro.</span></div></div></div></section><footer class="welcome-footer"><span>© Construtora NODAN</span><span>Ambiente protegido.</span></footer></main>`;
    }

    function renderShell(content) {
      const isDetail = state.screen === "detail";
      return `<div class="app-shell"><aside class="sidebar"><div class="sidebar-brand"><div class="sidebar-logo-box">${logoMarkup()}</div><div class="sidebar-brand-caption">Gestão patrimonial</div></div><div class="sidebar-section-label">Menu principal</div><button class="nav-item active" data-action="go-list">${icon("building",19)}<span>Imóveis</span><span class="nav-count">15</span></button><div class="sidebar-bottom"><div class="sidebar-user"><div class="sidebar-user-avatar">${escapeHtml(getInitials(currentUser?currentUser.nome:"?"))}</div><div class="sidebar-user-info"><strong>${escapeHtml(currentUser?currentUser.nome:"Usuário")}</strong><span>${escapeHtml(currentUser?(currentUser.nivel==="admin"?"Administrador":"Leitura"):"")}</span></div></div><button class="sidebar-logout" data-action="logout">${icon("logout",14)} Sair</button><div class="sidebar-copyright">NODAN · Imóveis</div></div></aside><main class="main-area"><header class="desktop-topbar"><div class="topbar-breadcrumb">NODAN <span class="topbar-separator">/</span> <strong>${escapeHtml(isDetail?"Ficha do imóvel":"Carteira")}</strong></div><div class="topbar-status"><span class="topbar-status-dot"></span> Google Drive Conectado</div></header><header class="mobile-bar"><div class="mobile-logo-box">${logoMarkup()}</div>${isDetail?`<button class="mobile-back" data-action="back">${icon("arrowLeft",15)} Voltar</button>`:`<span class="mobile-page-label">NODAN</span>`}</header><div class="content-wrap">${content}</div></main></div>`;
    }

    function renderList() {
      const filterBtns = [`<button class="filter-chip" data-action="filter-group" data-group-filter="all">Todos <span>${units.length}</span></button>`, ...groups.map(g => `<button class="filter-chip" data-action="filter-group" data-group-filter="${g.id}">${escapeHtml(g.name)} <span>${units.filter(u=>u.groupId===g.id).length}</span></button>`)].join("");
      const groupSections = groups.map(g => {
        const gu = units.filter(u => u.groupId === g.id);
        const cards = gu.map(u => {
          const t = tenants[u.id];
          const st = getStatus(u.id);
          const searchText = normalize([u.name, u.detail, u.address, g.name, t ? t.name : ""].join(" "));
          const photoUrl = getPhotoUrl(u.id, g.id, u.photo || g.cover);
          return `<a class="unit-card" href="#imovel-${u.id}" data-action="open-unit" data-id="${u.id}" data-group="${g.id}" data-search="${escapeHtml(searchText)}">${photoMarkup(photoUrl, u.name, "unit-photo-frame")}<div class="unit-card-body"><div class="unit-card-topline"><span class="status-tag ${st.kind}">${escapeHtml(st.label)}</span><span class="unit-card-arrow">${icon("chevronRight",15)}</span></div><h3>${escapeHtml(u.name)}</h3><p class="unit-card-location">${escapeHtml(g.name)}</p><div class="unit-card-footer"><span>Aluguel</span><strong>${escapeHtml(u.rent||"Não informado")}</strong></div></div></a>`;
        }).join("");
        return `<section class="group-section" data-group-section="${g.id}"><div class="group-heading">${photoMarkup(drivePhotos.groups[String(g.id)]||g.cover, g.name, "group-photo-frame")}<div class="group-heading-copy"><div class="group-overline">Empreendimento ${String(g.id).padStart(2,"0")}</div><h2>${escapeHtml(g.name)}</h2><p>${gu.length} ${gu.length===1?"unidade":"unidades"}</p></div></div><div class="unit-grid">${cards}</div></section>`;
      }).join("");

      return `<section class="page-heading"><div><div class="eyebrow">Painel NODAN</div><h1>Imóveis</h1><p>Selecione uma unidade para consultar ou registrar lançamentos.</p></div></section><div class="list-tools"><label class="search-box" for="property-search">${icon("search",18)}<input id="property-search" type="search" placeholder="Buscar imóvel..." value="${escapeHtml(state.query)}" autocomplete="off"></label><div class="results-count" id="results-count">15 unidades</div></div><div class="filter-row">${filterBtns}</div><div id="property-groups">${groupSections}</div><div id="no-results" class="no-results" hidden>Nenhum imóvel encontrado.</div>`;
    }

    function renderDetailsPanel(p) {
      const u = p.unit;
      return `<div class="panel-grid"><section class="panel"><div class="panel-heading"><div class="panel-icon">${icon("location",19)}</div><div><h2>Identificação</h2><p>Dados cadastrados.</p></div></div><div class="info-field-grid">${infoField("Unidade",u.name)}${infoField("Detalhamento",u.detail)}${infoField("Empreendimento",p.group.name)}${infoField("Aluguel",u.rent)}${infoField("Endereço",u.address,true)}</div></section><section class="panel"><div class="panel-heading"><div class="panel-icon">${icon("wallet",19)}</div><div><h2>Medidores e IPTU</h2></div></div><div class="meters-grid">${meterItem("IPTU",u.iptu,"file")}${meterItem("Água",u.water,"droplet")}${meterItem("AM Energia",u.energy,"bolt")}${meterItem("Âmbar",u.ambar,"bolt")}</div></section></div>`;
    }

    function renderTenantPanel(p) {
      const t = p.tenant;
      if (!t || t.name === "Condomínio" || t.name === "Imóvel próprio") {
        return `<section class="special-record"><div class="special-record-icon">${icon("building",25)}</div><h2>${escapeHtml(t?t.name:"Sem inquilino")}</h2><p>Esta unidade não possui contrato de inquilino ativo.</p></section>`;
      }
      return `<section class="panel tenant-panel"><div class="tenant-profile"><div class="tenant-avatar">${escapeHtml(getInitials(t.name))}</div><div><div class="eyebrow">Inquilino</div><h2>${escapeHtml(t.name)}</h2><p>${escapeHtml(p.unit.name)}</p></div></div><div class="tenant-fields">${infoField("CPF",t.cpf)}${infoField("Telefone",t.phone)}${infoField("Vencimento",t.dueDay?`Dia ${t.dueDay}`:"")}${infoField("Início",formatDate(t.start))}${infoField("Renovação",formatDate(t.renewal))}${infoField("Término",formatDate(t.end))}</div></section>`;
    }

    function renderDocumentsPanel(p) {
      return p.docs ? `<section class="documents-panel"><div class="document-card"><div class="document-icon">${icon("folder",25)}</div><div class="document-copy"><h2>Documentos de ${escapeHtml(p.unit.name)}</h2><p>Acesse a pasta no Google Drive.</p></div><a class="primary-button" href="${escapeHtml(p.docs)}" target="_blank" rel="noopener noreferrer">Abrir pasta ${icon("external",15)}</a></div></section>` : `<section class="empty-documents"><h2>Sem documentos</h2></section>`;
    }

    function renderPaymentsPanel(p) {
      if (p.unit.id > 12) return `<section class="special-record"><h2>Patrimônio próprio / Condomínio</h2><p>Sem lançamentos para esta categoria.</p></section>`;

      const allP = loadPayments();
      const uP = allP.filter(item => item.unitId === p.unit.id);
      const cY = new Date().getFullYear();
      const aY = Number(state.paymentYear);
      const aM = state.paymentMonth;

      const yP = uP.filter(item => Number(item.refYear) === aY);
      const totalAmount = yP.reduce((acc, item) => acc + Number(item.amount||0), 0);
      const filteredP = aM === "all" ? yP : yP.filter(item => Number(item.refMonth) === Number(aM));

      const monthChips = [`<button class="month-chip${aM==="all"?" active":""}" data-action="filter-payment-month" data-month="all">Todos</button>`, ...MONTHS_SHORT.map((s,i)=>{
        const m = i+1; const hasP = yP.some(item => Number(item.refMonth)===m);
        return `<button class="month-chip${String(aM)===String(m)?" active":""}${hasP?" has-payment":""}" data-action="filter-payment-month" data-month="${m}">${hasP?'<span class="month-chip-badge"></span>':""}${s}</button>`;
      })].join("");

      const rowsHtml = filteredP.length === 0
        ? `<tr><td colspan="5" class="empty-report">Nenhum pagamento encontrado.</td></tr>`
        : filteredP.map(item => `<tr><td><strong>${escapeHtml(formatDate(item.paymentDate))}</strong></td><td><span class="table-badge-month">${escapeHtml(MONTHS[Number(item.refMonth)-1])}/${item.refYear}</span></td><td class="table-amount">${escapeHtml(formatCurrency(item.amount))}</td><td>${escapeHtml(item.notes||"—")}</td><td style="text-align:right">${isAdmin()?`<button class="table-delete-btn" data-action="delete-payment" data-id="${item.id}">Excluir</button>`:""}</td></tr>`).join("");

      const formHtml = isAdmin() ? `
        <section class="payment-form-card">
          <div class="panel-heading"><div class="panel-icon green">${icon("wallet",20)}</div><div><h2>Registrar Pagamento</h2></div></div>
          <form id="payment-form">
            <div class="form-grid">
              <div class="form-group"><label>Data</label><input type="date" name="paymentDate" value="${new Date().toISOString().split("T")[0]}" required></div>
              <div class="form-group"><label>Mês Ref.</label><select name="refMonth">${MONTHS.map((m,i)=>`<option value="${i+1}" ${i===new Date().getMonth()?"selected":""}>${m}</option>`).join("")}</select></div>
              <div class="form-group"><label>Ano Ref.</label><select name="refYear"><option value="${cY}">${cY}</option><option value="${cY-1}">${cY-1}</option></select></div>
              <div class="form-group"><label>Valor (R$)</label><input type="number" step="0.01" name="amount" value="${parseNumericRent(p.unit.rent)}" required></div>
              <div class="form-group" style="grid-column: 1 / -1"><label>Observação</label><input type="text" name="notes" placeholder="Ex: Pix"></div>
            </div>
            <div class="form-actions"><button type="submit" class="primary-button gold">${icon("check",16)} Registrar Pagamento</button><div id="payment-save-status">${state.saveMessage?`<span class="save-feedback">${escapeHtml(state.saveMessage)}</span>`:""}</div></div>
          </form>
        </section>` : `<section class="special-record"><h2>Modo Leitura</h2><p>Lançamentos restritos a administradores.</p></section>`;

      return `<div class="payments-wrapper">${formHtml}<section class="report-card"><div class="report-topline"><h2>Histórico ${aY}</h2></div><div class="report-stats-grid"><div class="report-stat-box"><span>Total</span><strong class="green">${formatCurrency(totalAmount)}</strong></div></div><div class="month-filter-bar">${monthChips}</div><div style="overflow-x:auto"><table class="payments-table"><thead><tr><th>Data</th><th>Mês Ref.</th><th>Valor</th><th>Obs</th><th style="text-align:right">Ações</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></section></div>`;
    }

    function renderPropertyDetail(p) {
      let tabContent = renderDetailsPanel(p);
      if (state.tab === "inquilino") tabContent = renderTenantPanel(p);
      if (state.tab === "documentos") tabContent = renderDocumentsPanel(p);
      if (state.tab === "pagamentos") tabContent = renderPaymentsPanel(p);

      const tabs = [{id:"detalhes",label:"Detalhes",icon:"building"},{id:"inquilino",label:"Inquilino",icon:"user"},{id:"documentos",label:"Documentos",icon:"file"},{id:"pagamentos",label:"Pagamentos",icon:"wallet"}];
      return `<section class="detail-view"><div class="detail-heading"><div><h1>${escapeHtml(p.unit.name)}</h1><p>${escapeHtml(p.group.name)}</p></div><button class="back-link" data-action="back">${icon("arrowLeft",16)} Voltar</button></div><div class="detail-cover">${photoMarkup(getPhotoUrl(p.unit.id, p.unit.groupId, p.unit.photo||p.group.cover), p.unit.name, "detail-photo-frame")}</div><div class="tabs-wrap"><div class="tab-bar">${tabs.map(t=>`<button class="tab-button${state.tab===t.id?" active":""}" data-action="change-tab" data-tab="${t.id}">${icon(t.icon,17)}<span>${t.label}</span></button>`).join("")}</div></div><div>${tabContent}</div></section>`;
    }

    function render() {
      if (state.screen === "welcome") { app.innerHTML = renderWelcome(); return; }
      if (state.screen === "detail") {
        const p = getProperty(state.unitId);
        if (!p) { state.screen = "list"; render(); return; }
        app.innerHTML = renderShell(renderPropertyDetail(p));
        return;
      }
      app.innerHTML = renderShell(renderList());
      applyFilters();
    }

    function navigate(ns) { Object.assign(state, ns); render(); window.scrollTo(0, 0); }

    function applyFilters() {
      const query = normalize(state.query);
      let count = 0;
      document.querySelectorAll(".unit-card").forEach(card => {
        const matchesGroup = state.groupFilter === "all" || card.dataset.group === String(state.groupFilter);
        const matchesQuery = !query || (card.dataset.search || "").includes(query);
        const visible = matchesGroup && matchesQuery;
        card.hidden = !visible;
        if (visible) count++;
      });
      const cnt = document.getElementById("results-count");
      if (cnt) cnt.textContent = `${count} unidades`;
    }

    // Ações de Eventos
    app.addEventListener("click", e => {
      const c = e.target.closest("[data-action]");
      if (!c) return;
      const a = c.dataset.action;
      if (a === "enter" || a === "go-list") navigate({ screen: "list", unitId: null, tab: "detalhes" });
      if (a === "back") navigate({ screen: "list", unitId: null });
      if (a === "open-unit") { e.preventDefault(); navigate({ screen: "detail", unitId: Number(c.dataset.id), tab: "detalhes" }); }
      if (a === "change-tab") { state.tab = c.dataset.tab; render(); }
      if (a === "filter-group") { state.groupFilter = c.dataset.groupFilter; applyFilters(); }
      if (a === "filter-payment-month") { state.paymentMonth = c.dataset.month; render(); }
      if (a === "logout") {
        currentUser = null;
        localStorage.removeItem("NODAN_SESSION");
        loginScreen.hidden = false;
        app.hidden = true;
      }
      if (a === "delete-payment") {
        if (confirm("Excluir este lançamento?")) {
          const id = c.dataset.id;
          savePayments(loadPayments().filter(p => p.id !== id));
          syncWithDrive({ action: "delete", id: id });
          render();
        }
      }
    });

    app.addEventListener("input", e => { if (e.target.id === "property-search") { state.query = e.target.value; applyFilters(); } });

    app.addEventListener("submit", e => {
      if (e.target.id === "payment-form") {
        e.preventDefault();
        const p = getProperty(state.unitId);
        if (!p) return;
        const f = e.target;
        const np = {
          id: "PAY_" + Date.now(),
          unitId: p.unit.id,
          unitName: p.unit.name,
          tenantName: p.tenant ? p.tenant.name : "Não informado",
          paymentDate: f.paymentDate.value,
          refMonth: Number(f.refMonth.value),
          refYear: Number(f.refYear.value),
          amount: parseFloat(f.amount.value) || 0,
          notes: f.notes.value.trim(),
          action: "create"
        };
        const list = loadPayments();
        list.push(np);
        savePayments(list);
        syncWithDrive(np);
        state.saveMessage = "Pagamento gravado com sucesso!";
        render();
      }
    });

    // SISTEMA DE AUTENTICAÇÃO COM GOOGLE
    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
      } catch(e) { return null; }
    }

    window.handleCredentialResponse = function(response) {
      const payload = parseJwt(response.credential);
      if (!payload || !payload.email) {
        loginStatus.innerHTML = '<div class="login-error">Erro ao ler credenciais do Google.</div>';
        return;
      }
      const email = payload.email.trim().toLowerCase();
      loginStatus.innerHTML = '<div class="login-loading">Autenticando na planilha...</div>';

      fetch(`${GOOGLE_SCRIPT_URL}?action=login&email=${encodeURIComponent(email)}`)
        .then(r => r.json())
        .then(d => {
          if (d && d.status === "ok") {
            currentUser = { email: email, nome: d.nome, nivel: d.nivel };
            localStorage.setItem("NODAN_SESSION", JSON.stringify(currentUser));
            loginScreen.hidden = true;
            app.hidden = false;
            render();
            // Carrega fotos do drive em segundo plano
            fetch(`${GOOGLE_SCRIPT_URL}?action=photos`).then(r=>r.json()).then(p=>{ if(p&&p.photos){ drivePhotos=p.photos; render(); } }).catch(()=>{});
          } else {
            loginStatus.innerHTML = `<div class="login-error">E-mail não autorizado: <strong>${escapeHtml(email)}</strong></div>`;
          }
        })
        .catch(err => {
          loginStatus.innerHTML = '<div class="login-error">Falha ao conectar no servidor. Tente novamente.</div>';
        });
    };

    // Auto-login se sessão salva existir
    (function checkSession() {
      const saved = localStorage.getItem("NODAN_SESSION");
      if (saved) {
        try {
          const session = JSON.parse(saved);
          if (session && session.email && session.nivel) {
            currentUser = session;
            loginScreen.hidden = true;
            app.hidden = false;
            render();
            fetch(`${GOOGLE_SCRIPT_URL}?action=photos`).then(r=>r.json()).then(p=>{ if(p&&p.photos){ drivePhotos=p.photos; render(); } }).catch(()=>{});
          }
        } catch(e) {}
      }
    })();
  </script>
