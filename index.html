<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102033">
<title>NODAN | Gestão de Imóveis</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--navy:#102033;--navy-2:#172c43;--navy-3:#203a55;--gold:#c6a66c;--gold-light:#e9ddc7;--ink:#182638;--muted:#718094;--line:#e4eaf0;--canvas:#f4f6f8;--white:#fff;--green:#2d7a54;--green-bg:#eaf5ee;--shadow:0 14px 35px rgba(19,36,56,.08);--radius:18px}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--canvas);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(198,166,108,.45);outline-offset:3px}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;background:radial-gradient(ellipse at 85% 18%,rgba(198,166,108,.18),transparent 31%),linear-gradient(135deg,#0c1927 0%,#142b41 55%,#0e2033 100%);color:#fff;text-align:center}
.login-box{width:min(420px,100%);padding:40px 30px;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:rgba(255,255,255,.075);box-shadow:0 25px 70px rgba(0,0,0,.18);backdrop-filter:blur(12px)}
.login-logo{width:180px;height:65px;margin:0 auto 20px;padding:10px 15px;border-radius:14px;background:#fff}
.login-box h1{margin:0 0 8px;font-size:26px;letter-spacing:-.03em}
.login-box p{margin:0 0 28px;color:rgba(255,255,255,.6);font-size:13px;line-height:1.6}
.login-google-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border:0;border-radius:12px;color:#1a2838;background:var(--gold);font-size:14px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:transform .2s,background .2s}
.login-google-btn:hover{transform:translateY(-2px);background:#d3b783}
.login-google-btn svg{width:20px;height:20px}
.login-error{margin-top:18px;padding:12px 16px;border-radius:12px;background:rgba(220,60,60,.15);border:1px solid rgba(220,60,60,.3);color:#ff8a8a;font-size:12px;line-height:1.5}
.login-loading{margin-top:18px;color:rgba(255,255,255,.5);font-size:12px}
.login-footer{margin-top:30px;color:rgba(255,255,255,.35);font-size:10px}
.logo-mark{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-mark img{display:block;max-width:100%;max-height:100%;object-fit:contain}
.logo-fallback{color:var(--navy);font-size:25px;font-weight:850;letter-spacing:.18em}
.welcome-screen{min-height:100vh;position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;padding:28px clamp(20px,5vw,76px) 24px;color:#fff;background:radial-gradient(ellipse at 85% 18%,rgba(198,166,108,.18),transparent 31%),linear-gradient(135deg,#0c1927 0%,#142b41 55%,#0e2033 100%)}
.welcome-screen::before,.welcome-screen::after{content:"";position:absolute;z-index:-1;border:1px solid rgba(255,255,255,.08);border-radius:50%;pointer-events:none}
.welcome-screen::before{width:650px;height:650px;right:-230px;top:100px}
.welcome-screen::after{width:460px;height:460px;right:-135px;top:195px}
.welcome-top{width:min(1320px,100%);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.welcome-logo-box{width:205px;height:72px;padding:10px 17px;border-radius:15px;background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.12)}
.welcome-top-note,.welcome-kicker{display:inline-flex;align-items:center;gap:10px;color:rgba(255,255,255,.72);font-size:11px;font-weight:750;letter-spacing:.17em;text-transform:uppercase}
.welcome-top-note::before,.welcome-kicker::before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(198,166,108,.13)}
.welcome-content{width:min(1320px,100%);margin:auto;padding:65px 0 70px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(330px,.8fr);align-items:center;gap:clamp(40px,8vw,120px)}
.welcome-copy h1{max-width:720px;margin:20px 0;font-size:clamp(43px,6.2vw,82px);line-height:.99;letter-spacing:-.055em;font-weight:760}
.welcome-copy h1 em{color:var(--gold);font-style:normal}
.welcome-copy>p{max-width:560px;margin:0;color:rgba(255,255,255,.68);font-size:16px;line-height:1.8}
.welcome-cta{min-height:54px;margin-top:30px;padding:0 23px;display:inline-flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:12px;color:#19293a;background:var(--gold);font-weight:800;box-shadow:0 12px 28px rgba(0,0,0,.18);transition:transform .2s,background .2s}
.welcome-cta:hover{transform:translateY(-2px);background:#d3b783}
.welcome-cta svg{width:19px;height:19px}
.welcome-caption{margin-top:20px;color:rgba(255,255,255,.48);font-size:12px}
.welcome-preview{padding:25px;border:1px solid rgba(255,255,255,.13);border-radius:24px;background:rgba(255,255,255,.075);box-shadow:0 25px 70px rgba(0,0,0,.18);backdrop-filter:blur(12px)}
.preview-topline{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.6);font-size:10px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
.preview-topline span{color:var(--gold);letter-spacing:.04em}
.preview-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.preview-stat{min-height:95px;padding:16px 12px;border:1px solid rgba(255,255,255,.10);border-radius:15px;background:rgba(255,255,255,.055)}
.preview-stat strong{display:block;color:#fff;font-size:29px;line-height:1.1}
.preview-stat span{display:block;margin-top:8px;color:rgba(255,255,255,.57);font-size:11px}
.preview-feature{display:flex;align-items:center;gap:14px;padding:17px;border-radius:16px;background:rgba(8,19,31,.36)}
.preview-feature-icon{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:13px;color:var(--gold);background:rgba(198,166,108,.15)}
.preview-feature-icon svg{width:22px;height:22px}
.preview-feature strong{display:block;font-size:14px}
.preview-feature span{display:block;margin-top:5px;color:rgba(255,255,255,.54);font-size:12px}
.preview-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}
.preview-pills span{padding:7px 10px;border:1px solid rgba(255,255,255,.12);border-radius:99px;color:rgba(255,255,255,.68);font-size:10px}
.welcome-footer{width:min(1320px,100%);margin:0 auto;display:flex;justify-content:space-between;gap:15px;color:rgba(255,255,255,.42);font-size:11px}
.app-shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:25px 17px 18px;display:flex;flex-direction:column;color:rgba(255,255,255,.78);background:var(--navy)}
.sidebar-brand{padding:0 5px}
.sidebar-logo-box{width:100%;height:70px;padding:9px 16px;border-radius:14px;background:#fff}
.sidebar-brand-caption{margin-top:12px;color:rgba(255,255,255,.42);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.sidebar-section-label{margin:34px 12px 11px;color:rgba(255,255,255,.39);font-size:9px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}
.nav-item{width:100%;min-height:48px;padding:0 12px;display:flex;align-items:center;gap:11px;border:0;border-radius:11px;color:rgba(255,255,255,.72);background:transparent;text-align:left;transition:background .18s,color .18s}
.nav-item svg{width:19px;height:19px;flex:0 0 19px}
.nav-item span:nth-child(2){flex:1;font-size:13px;font-weight:650}
.nav-item:hover,.nav-item.active{color:#fff;background:rgba(255,255,255,.10)}
.nav-count{min-width:25px;padding:4px 6px;border-radius:20px;color:var(--gold-light);background:rgba(198,166,108,.15);font-size:10px;text-align:center}
.sidebar-bottom{margin-top:auto}
.sidebar-note{padding:15px 13px;border:1px solid rgba(255,255,255,.10);border-radius:13px;background:rgba(255,255,255,.045)}
.sidebar-note-title{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.88);font-size:11px;font-weight:700}
.sidebar-note-title svg{color:var(--gold)}
.sidebar-note p{margin:8px 0 0;color:rgba(255,255,255,.48);font-size:10px;line-height:1.6}
.sidebar-copyright{margin:17px 3px 0;color:rgba(255,255,255,.32);font-size:9px}
.sidebar-user{margin-top:14px;padding:12px 13px;border:1px solid rgba(255,255,255,.10);border-radius:13px;background:rgba(255,255,255,.045);display:flex;align-items:center;gap:10px}
.sidebar-user-avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:rgba(198,166,108,.2);display:grid;place-items:center;color:var(--gold);font-size:13px;font-weight:800}
.sidebar-user-info{min-width:0;flex:1}
.sidebar-user-info strong{display:block;color:rgba(255,255,255,.85);font-size:11px}
.sidebar-user-info span{display:block;color:rgba(255,255,255,.42);font-size:9px}
.sidebar-logout{margin-top:8px;width:100%;min-height:36px;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.10);border-radius:10px;color:rgba(255,255,255,.55);background:transparent;font-size:10px;font-weight:700;transition:all .18s}
.sidebar-logout:hover{color:#fff;background:rgba(220,60,60,.2);border-color:rgba(220,60,60,.3)}
.main-area{min-width:0}
.desktop-topbar{min-height:72px;padding:0 clamp(24px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92)}
.topbar-breadcrumb{color:var(--muted);font-size:12px}
.topbar-breadcrumb strong{color:var(--ink);font-weight:700}
.topbar-separator{margin:0 8px;color:#c0c8d1}
.topbar-status{display:inline-flex;align-items:center;gap:8px;color:#708092;font-size:11px}
.topbar-status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(45,122,84,.12)}
.mobile-bar{display:none}
.content-wrap{width:min(1500px,100%);margin:0 auto;padding:34px clamp(22px,4vw,54px) 60px}
.page-heading{margin-bottom:27px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.eyebrow{margin:0 0 9px;color:#9a7a43;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.page-heading h1,.detail-heading h1{margin:0;color:var(--ink);font-size:clamp(30px,3.4vw,42px);line-height:1.1;letter-spacing:-.045em}
.page-heading p{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.heading-summary{min-width:190px;padding:15px 18px;display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 5px 18px rgba(19,36,56,.035)}
.heading-summary-icon{width:41px;height:41px;display:grid;place-items:center;border-radius:12px;color:#947441;background:#f5efe4}
.heading-summary-icon svg{width:21px;height:21px}
.heading-summary strong{display:block;color:var(--ink);font-size:19px;line-height:1.1}
.heading-summary span{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.list-tools{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:17px}
.search-box{width:min(440px,100%);min-height:46px;padding:0 13px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:border .18s,box-shadow .18s}
.search-box:focus-within{border-color:#c4a56d;box-shadow:0 0 0 3px rgba(198,166,108,.12)}
.search-box svg{width:18px;height:18px;flex:0 0 18px;color:#8794a3}
.search-box input{width:100%;min-width:0;border:0;outline:0;color:var(--ink);background:transparent;font-size:12px}
.search-box input::placeholder{color:#a1acb8}
.results-count{color:var(--muted);font-size:11px;white-space:nowrap}
.filter-row{margin-bottom:31px;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 7px;scrollbar-width:thin}
.filter-chip{flex:0 0 auto;min-height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:30px;color:#657488;background:#fff;font-size:10px;font-weight:650;transition:all .18s}
.filter-chip span{min-width:19px;padding:3px 5px;border-radius:20px;color:#8090a1;background:#f1f4f6;font-size:9px;text-align:center}
.filter-chip:hover,.filter-chip.active{border-color:var(--navy);color:#fff;background:var(--navy)}
.filter-chip.active span{color:#fff;background:rgba(255,255,255,.16)}
.group-section{margin-top:26px}
.group-heading{margin-bottom:15px;display:flex;align-items:center;gap:14px}
.group-heading-copy{min-width:0}
.group-overline{color:#9a7a43;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.group-heading h2{margin:4px 0 0;color:var(--ink);font-size:17px;letter-spacing:-.02em}
.group-heading p{margin:4px 0 0;color:var(--muted);font-size:10px}
.unit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.unit-card{min-width:0;overflow:hidden;display:block;border:1px solid var(--line);border-radius:17px;color:inherit;background:#fff;text-decoration:none;box-shadow:0 4px 14px rgba(19,36,56,.025);transition:transform .2s,box-shadow .2s,border-color .2s}
.unit-card:hover{transform:translateY(-3px);border-color:#d6c29e;box-shadow:var(--shadow)}
.unit-card[hidden]{display:none!important}
.unit-card-body{padding:14px 15px 13px}
.unit-card-topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.status-tag{max-width:100%;padding:5px 8px;overflow:hidden;border-radius:30px;color:#596b7b;background:#eef2f5;font-size:9px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}
.status-tag.contract{color:#2d7a54;background:#eaf5ee}
.status-tag.owned{color:#8a6a32;background:#f6f0e4}
.status-tag.condo{color:#52698c;background:#edf1f8}
.unit-card-arrow{width:27px;height:27px;flex:0 0 27px;display:grid;place-items:center;border-radius:50%;color:#708094;background:#f4f6f8;transition:all .18s}
.unit-card:hover .unit-card-arrow{color:#fff;background:var(--navy);transform:translateX(2px)}
.unit-card-arrow svg{width:15px;height:15px}
.unit-card h3{margin:12px 0 4px;overflow-wrap:anywhere;color:var(--ink);font-size:15px;letter-spacing:-.02em}
.unit-card-location{margin:0;overflow:hidden;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}
.unit-card-footer{margin-top:14px;padding-top:11px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #edf0f3}
.unit-card-footer span{color:#8b98a6;font-size:10px}
.unit-card-footer strong{color:var(--ink);font-size:11px}
.no-results{margin-top:24px;padding:34px 20px;border:1px dashed #cbd4de;border-radius:16px;color:var(--muted);background:#fff;text-align:center;font-size:13px}
.photo-frame{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(135deg,#314a61,#14283c)}
.photo-frame img{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block;object-fit:cover;transition:transform .45s}
.photo-fallback{position:absolute;z-index:0;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;color:rgba(255,255,255,.83);background:radial-gradient(circle at 80% 18%,rgba(198,166,108,.23),transparent 30%),linear-gradient(135deg,#344f68,#14283c);text-align:center;transition:opacity .25s,visibility .25s}
.photo-frame.is-loaded .photo-fallback{visibility:hidden;opacity:0}
.fallback-icon{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);border-radius:12px;color:var(--gold-light);font-size:16px;font-weight:800;letter-spacing:.08em}
.fallback-label{max-width:90%;font-size:11px;font-weight:650}
.photo-fallback small{color:rgba(255,255,255,.50);font-size:9px}
.group-photo-frame{width:66px;height:58px;flex:0 0 66px;border-radius:13px}
.group-photo-frame .fallback-icon{width:25px;height:25px;border-radius:8px;font-size:11px}
.group-photo-frame .fallback-label,.group-photo-frame .photo-fallback small{display:none}
.unit-photo-frame{width:100%;height:177px}
.unit-card:hover .unit-photo-frame img{transform:scale(1.04)}
.detail-heading{margin-bottom:21px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.detail-heading p{margin:9px 0 0;color:var(--muted);font-size:12px}
.detail-heading p span{color:#9a7a43;font-weight:700}
.back-link{flex:0 0 auto;min-height:39px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;color:#536478;background:#fff;font-size:10px;font-weight:700;transition:all .18s}
.back-link:hover{border-color:var(--navy);color:#fff;background:var(--navy)}
.back-link svg{width:16px;height:16px}
.detail-cover{position:relative;height:clamp(255px,31vw,410px);overflow:hidden;border-radius:21px;background:var(--navy-2);box-shadow:var(--shadow)}
.detail-photo-frame{width:100%;height:100%}
.detail-photo-frame::after{content:"";position:absolute;z-index:2;inset:0;background:linear-gradient(180deg,rgba(7,17,27,.04) 20%,rgba(7,17,27,.78) 100%);pointer-events:none}
.detail-cover-content{position:absolute;z-index:3;inset:0;padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.cover-topline,.cover-bottomline{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.cover-status{display:inline-flex;align-items:center;padding:8px 11px;border:1px solid rgba(255,255,255,.21);border-radius:30px;color:#fff;background:rgba(12,25,39,.52);backdrop-filter:blur(8px);font-size:10px;font-weight:700}
.cover-image-note{color:rgba(255,255,255,.75);font-size:10px;text-align:right}
.cover-bottomline{align-items:flex-end}
.cover-bottomline span{display:block;color:rgba(255,255,255,.68);font-size:10px}
.cover-bottomline strong{display:block;margin-top:5px;font-size:17px}
.cover-price{text-align:right}
.cover-price strong{font-size:clamp(19px,2.5vw,28px);letter-spacing:-.03em}
.tabs-wrap{margin:22px 0 18px;display:flex;justify-content:center}
.tab-bar{width:min(880px,100%);padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border:1px solid #e8edf1;border-radius:14px;background:#edf1f4}
.tab-button{min-height:48px;padding:0 8px;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;color:#647488;background:transparent;font-size:11px;font-weight:750;transition:all .18s;white-space:nowrap}
.tab-button svg{width:17px;height:17px;flex:0 0 17px}
.tab-button:hover{color:var(--ink)}
.tab-button.active{color:var(--navy);background:#fff;box-shadow:0 3px 12px rgba(18,35,54,.09)}
.tab-button[data-tab="pagamentos"].active{color:var(--green)}
.panel-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.panel{min-width:0;padding:22px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 4px 14px rgba(19,36,56,.025)}
.panel-heading{margin-bottom:19px;display:flex;align-items:flex-start;gap:12px}
.panel-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:11px;color:#957746;background:#f5efe4}
.panel-icon.green{color:#2d7a54;background:#eaf5ee}
.panel-icon svg{width:19px;height:19px}
.panel-heading h2{margin:1px 0 0;color:var(--ink);font-size:14px}
.panel-heading p{margin:5px 0 0;color:var(--muted);font-size:10px;line-height:1.5}
.info-field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.info-field{min-width:0}
.info-field.wide{grid-column:1/-1}
.info-field>span{display:block;margin-bottom:6px;color:#8794a2;font-size:9px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.info-field strong{display:block;overflow-wrap:anywhere;color:#28394b;font-size:11px;font-weight:700;line-height:1.6}
.meters-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meter-item{min-width:0;min-height:70px;padding:12px;display:flex;align-items:center;gap:10px;border:1px solid #edf0f3;border-radius:12px;background:#fbfcfd}
.meter-icon{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;border-radius:10px;color:#698096;background:#eef3f6}
.meter-icon svg{width:16px;height:16px}
.meter-item span{display:block;color:#8794a2;font-size:9px}

function photoMarkup(src,alt,extraClass=""){const image=src?`<img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" loading="lazy" onload="this.closest('.photo-frame').classList.add('is-loaded')" onerror="this.remove()">`:"";return `<div class="photo-frame ${escapeHtml(extraClass)}"><div class="photo-fallback"><span class="fallback-icon">N</span><span class="fallback-label">${escapeHtml(alt)}</span><small>Imagem não disponível</small></div>${image}</div>`}
function getProperty(id){const unit=units.find(i=>i.id===Number(id));if(!unit)return null;return{unit,group:groups.find(i=>i.id===unit.groupId),tenant:tenants[unit.id]||null,docs:driveDocs[unit.id]||""}}
function formatDate(v){if(!v)return"Não informado";const p=v.split("-");if(p.length!==3)return v;return `${p[2]}/${p[1]}/${p[0]}`}
function formatCurrency(n){return Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function parseNumericRent(r){if(!r)return"";const c=r.replace(/[^\d,]/g,"").replace(",",".");const v=parseFloat(c);return isNaN(v)?"":v.toFixed(2)}
function getStatus(id){if(id<=12)return{label:"Contrato cadastrado",kind:"contract"};if(id===13)return{label:"Condomínio",kind:"condo"};return{label:"Imóvel próprio",kind:"owned"}}
function infoField(label,value,wide=false){const v=value===""||value==null?"Não informado":value;return `<div class="info-field${wide?" wide":""}"><span>${escapeHtml(label)}</span><strong>${escapeHtml(v)}</strong></div>`}

function getInitials(name){return String(name||"").trim().split(/\s+/).slice(0,2).map(p=>p.charAt(0)).join("").toUpperCase()}

function renderWelcome(){return `<main class="welcome-screen"><header class="welcome-top"><div class="welcome-logo-box">${logoMarkup()}</div><div class="welcome-top-note">Portal de gestão imobiliária</div></header><section class="welcome-content"><div class="welcome-copy"><div class="welcome-kicker">Painel NODAN</div><h1>Seu patrimônio,<br><em>sob controle.</em></h1><p>Imóveis, informações de contratos, pagamentos e documentos organizados em um único lugar. Escolha uma unidade e encontre os dados com poucos toques.</p><button class="welcome-cta" data-action="enter">Acessar imóveis ${icon("arrowRight",19)}</button><div class="welcome-caption">Uso administrativo · Visualização adaptada para celular, tablet e computador</div></div><div class="welcome-preview" aria-label="Resumo do cadastro"><div class="preview-topline"><span>Visão geral</span><span>Carteira NODAN</span></div><div class="preview-stats"><div class="preview-stat"><strong>15</strong><span>unidades</span></div><div class="preview-stat"><strong>06</strong><span>empreendimentos</span></div><div class="preview-stat"><strong>12</strong><span>cadastros de inquilino</span></div></div><div class="preview-feature"><div class="preview-feature-icon">${icon("building",22)}</div><div><strong>Informação a um clique</strong><span>Detalhes, inquilino, documentos e pagamentos por unidade.</span></div></div><div class="preview-pills"><span>Endereços</span><span>Contas dos imóveis</span><span>Contratos</span><span>Registro de Pagamentos</span></div></div></section><footer class="welcome-footer"><span>© Construtora NODAN</span><span>Dados administrativos: mantenha este app em ambiente protegido.</span></footer></main>`}

gamentos e documentos.</p></div><div class="heading-summary"><div class="heading-summary-icon">${icon("building",21)}</div><div><strong>15 unidades</strong><span>em 6 empreendimentos</span></div></div></section><div class="list-tools"><label class="search-box" for="property-search">${icon("search",18)}<input id="property-search" type="search" placeholder="Buscar imóvel, empreendimento ou inquilino..." value="${escapeHtml(state.query)}" autocomplete="off"></label><div class="results-count" id="results-count">15 unidades</div></div><div class="filter-row">${filterButtons}</div><div id="property-groups">${groupSections}</div><div id="no-results" class="no-results" hidden>Nenhum imóvel encontrado. Tente outro nome ou empreendimento.</div>`}
function renderDetailsPanel(property){const u=property.unit;return `<div class="panel-grid"><section class="panel"><div class="panel-heading"><div class="panel-icon">${icon("location",19)}</div><div><h2>Identificação e endereço</h2><p>Dados cadastrados para esta unidade.</p></div></div><div class="info-field-grid">${infoField("Unidade",u.name)}${infoField("Detalhamento cadastrado",u.detail)}${infoField("Empreendimento",property.group.name)}${infoField("Valor do aluguel",u.rent)}${infoField("Endereço",u.address,true)}</div></section><section class="panel"><div class="panel-heading"><div class="panel-icon">${icon("wallet",19)}</div><div><h2>Contas e cadastros</h2><p>Referências informadas para o imóvel.</p></div></div><div class="meters-grid">${meterItem("IPTU",u.iptu,"file")}${meterItem("Água",u.water,"droplet")}${meterItem("AM Energia",u.energy,"bolt")}${meterItem("Âmbar",u.ambar,"bolt")}</div></section></div><div class="panel-footnote">${icon("info",16)}<span>Valores e identificadores exibidos conforme os dados fornecidos. "Não informado" indica um campo que estava vazio na tabela.</span></div>`}

function renderPaymentsPanel(property){if(property.unit.id>12){return `<section class="special-record"><div class="special-record-icon">${icon("building",25)}</div><h2>Imóvel próprio / Condomínio</h2><p>Esta unidade está identificada como patrimônio próprio ou condomínio. Não possui cobrança de aluguel nem registro de pagamentos de inquilino.</p></section>`}const allP=loadPayments();const uP=allP.filter(p=>p.unitId===property.unit.id);const cY=new Date().getFullYear();const yS=new Set([cY-1,cY,cY+1]);uP.forEach(p=>yS.add(Number(p.refYear)));const sY=Array.from(yS).sort((a,b)=>b-a);const aY=Number(state.paymentYear);const aM=state.paymentMonth;const yP=uP.filter(p=>Number(p.refYear)===aY);const tA=yP.reduce((a,p)=>a+Number(p.amount||0),0);const dM=new Set(yP.map(p=>Number(p.refMonth))).size;const fP=aM==="all"?yP:yP.filter(p=>Number(p.refMonth)===Number(aM));fP.sort((a,b)=>new Date(b.paymentDate)-new Date(a.paymentDate));const tI=new Date().toISOString().split("T")[0];const cM=new Date().getMonth()+1;const dR=parseNumericRent(property.unit.rent);const mF=[`<button class="month-chip${aM==="all"?" active":""}" data-action="filter-payment-month" data-month="all">Todos os meses</button>`,...MONTHS_SHORT.map((s,i)=>{const m=i+1;const h=yP.some(p=>Number(p.refMonth)===m);const sel=String(aM)===String(m);return `<button class="month-chip${sel?" active":""}${h?" has-payment":""}" data-action="filter-payment-month" data-month="${m}">${h?'<span class="month-chip-badge"></span>':""}${s}</button>`})].join("");let tR="";if(fP.length===0){tR=`<tr><td colspan="5" class="empty-report">Nenhum pagamento registrado para ${aM==="all"?"o ano de "+aY:MONTHS[Number(aM)-1]+" de "+aY}.</td></tr>`}else{tR=fP.map(p=>`<tr><td><strong>${escapeHtml(formatDate(p.paymentDate))}</strong></td><td><span class="table-badge-month">${escapeHtml(MONTHS[Number(p.refMonth)-1])} / ${escapeHtml(p.refYear)}</span></td><td class="table-amount">${escapeHtml(formatCurrency(p.amount))}</td><td style="color:#6d7f92 function renderPropertyDetail(property){const u=property.unit;const st=getStatus(u.id);const imgSrc=getPhotoUrl(u.id,u.groupId,u.photo||property.group.cover);const imgNote=u.photo||drivePhotos.units[String(u.id)]?"Foto da unidade":"Imagem do empreendimento";let tabContent=renderDetailsPanel(property);if(state.tab==="inquilino")tabContent=renderTenantPanel(property);if(state.tab==="documentos")tabContent=renderDocumentsPanel(property);if(state.tab==="pagamentos")tabContent=renderPaymentsPanel(property);const tabs=[{id:"detalhes",label:"Detalhes",icon:"building"},{id:"inquilino",label:"Inquilino",icon:"user"},{id:"documentos",label:"Documentos",icon:"file"},{id:"pagamentos",label:"Pagamentos",icon:"wallet"}];return `<section class="detail-view"><div class="detail-heading"><div><div class="eyebrow">Ficha do imóvel · ID ${u.id}</div><h1>${escapeHtml(u.name)}</h1><p>${escapeHtml(property.group.name)} <span>· ${escapeHtml(u.detail)}</span></p></div><button class="back-link" data-action="back">${icon("arrowLeft",16)} Todos os imóveis</button></div><div class="detail-cover">${photoMarkup(imgSrc,u.name,"detail-photo-frame")}<div class="detail-cover-content"><div class="cover-topline"><span class="cover-status">${escapeHtml(st.label)}</span><span class="cover-image-note">${escapeHtml(imgNote)}</span></div><div class="cover-bottomline"><div><span>Empreendimento</span><strong>${escapeHtml(property.group.name)}</strong></div><div class="cover-price"><span>Valor de aluguel informado</span><strong>${escapeHtml(u.rent||"Não informado")}</strong></div></div></div></div><div class="tabs-wrap"><div class="tab-bar" role="tablist" aria-label="Informações do imóvel">${tabs.map(t=>`<button class="tab-button${state.tab===t.id?" active":""}" role="tab" aria-selected="${state.tab===t.id}" data-action="change-tab" data-tab="${t.id}">${icon(t.icon,17)}<span>${t.label}</span></button>`).join("")}</div></div><div class="tab-content" role="tabpanel">${tabContent}</div></section>`}
function render(){if(state.screen==="welcome"){app.innerHTML=renderWelcome();document.title="NODAN | Gestão de Imóveis";return}if(state.screen==="detail"){const p=getProperty(state.unitId);if(!p){state.screen="list";state.unitId=null;app.innerHTML=renderShell(renderList());applyFilters();return}app.innerHTML=renderShell(renderPropertyDetail(p));document.title=`${p.unit.name} | NODAN`;return}app.innerHTML=renderShell(renderList());document.title="Imóveis | NODAN";applyFilters()}
function syncCurrentRoute(){const d=routeHistory.length-1;const s={...state,__routeDepth:d};routeHistory[d]=s;if(historyEnabled){try{history.replaceState(s,"")}catch(e){historyEnabled=false}}}
function navigate(ns){Object.assign(state,ns);const s={...state,__routeDepth:routeHistory.length};routeHistory.push(s);if(historyEnabled){try{history.pushState(s,"")}catch(e){historyEnabled=false}}render();window.scrollTo(0,0)}
function goBack(){if(routeHistory.length<=1)return;if(historyEnabled){history.back()}else{routeHistory.pop();Object.assign(state,routeHistory[routeHistory.length-1]);render();window.scrollTo(0,0)}}
function goToList(){if(state.screen==="list")return;if(state.screen==="detail"&&routeHistory.length>1){goBack();return}navigate({screen:"list",unitId:null,tab:"detalhes"})}
window.addEventListener("popstate",e=>{if(e.state&&Number.isFinite(e.state.__routeDepth)){const d=e.state.__routeDepth;routeHistory=routeHistory.slice(0,d+1);Object.assign(state,e.state)}else{const ws={screen:"welcome",unitId:null,tab:"detalhes",query:"",groupFilter:"all",paymentYear:new Date().getFullYear(),paymentMonth:"all",saveMessage:"",__routeDepth:0};routeHistory=[ws];Object.assign(state,ws)}render();window.scrollTo(0,0)});
function applyFilters(){const cards=Array.from(document.querySelectorAll(".unit-card"));const q=normalize(state.query);let vc=0;cards.forEach(c=>{const mg=state.groupFilter==="all"||c.dataset.group===String(state.groupFilter);const mq=!q||(c.dataset.search||"").includes(q);const v=mg&&mq;c.hidden=!v;if(v)vc++});document.querySelectorAll("[data-group-section]").forEach(s=>{s.hidden=!Boolean(s.querySelector(".unit-card:not([hidden])"))});const cnt=document.getElementById("results-count");if(cnt)cnt.textContent=`${vc} ${vc===1?"unidade":"unidades"}`;const nr=document.getElementById("no-results");if(nr)nr.hidden=vc>0;document.querySelectorAll(".filter-chip").forEach(b=>{const a=b.dataset.groupFilter===String(state.groupFilter);b.classList.toggle("active",a);b.setAttribute("aria-pressed",String(a))})}
app.addEventListener("click",e=>{const c=e.target.closest("[data-action]");if(!c)return;const a=c.dataset.action;if(a==="enter")navigate({screen:"list",unitId:null,tab:"detalhes"});if(a==="go-list")goToList();if(a==="back")goBack();if(a==="logout"){currentUser=null;localStorage.removeItem("NODAN_SESSION");loginScreen.hidden=false;app.hidden=true;return}if(a==="open-unit"){e.preventDefault();navigate({screen:"detail",unitId:Number(c.dataset.id),tab:"detalhes",saveMessage:""})}if(a==="change-tab"){state.tab=c.dataset.tab;state.saveMessage="";syncCurrentRoute();const sc=window.scrollY;render();window.scrollTo(0,sc)}if(a==="filter-group"){state.groupFilter=c.dataset.groupFilter;syncCurrentRoute();applyFilters()}if(a==="filter-payment-month"){state.paymentMonth=c.dataset.month;const sc=window.scrollY;render();window.scrollTo(0,sc)}if(a==="delete-payment"){const id=c.dataset.id;if(confirm("Deseja realmente excluir este lançamento?")){const l=loadPayments().filter(p=>p.id!==id);savePayments(l);syncWithDrive({action:"delete",id:id});const sc=window.scrollY;render();window.scrollTo(0,sc)}}});
app.addEventListener("change",e=>{if(e.target.dataset.action==="change-payment-year"){state.paymentYear=Number(e.target.value);state.paymentMonth="all";const sc=window.scrollY;render();window.scrollTo(0,sc)}});
app.addEventListener("input",e=>{if(e.target.id==="property-search"){state.query=e.target.value;syncCurrentRoute();applyFilters()}});
app.addEventListener("submit",e=>{if(e.target.id==="payment-form"){e.preventDefault();const prop=getProperty(state.unitId);if(!prop)return;const f=e.target;const pd=f.paymentDate.value;const rm=Number(f.refMonth.value);const ry=Number(f.refYear.value);const am=parseFloat(f.amount.value)||0;const nt=f.notes.value.trim();if(!pd||!am){alert("Por favor, preencha a data e o valor pago.");return}const np={id:"PAY_"+Date.now(),unitId:prop.unit.id,unitName:prop.unit.name,tenantName:prop.tenant?prop.tenant.name:"Não informado",paymentDate:pd,refMonth:rm,refYear:ry,amount:am,notes:nt,action:"create"};const l=loadPayments();l.push(np);savePayments(l);syncWithDrive(np);state.saveMessage=`Pagamento de ${formatCurrency(am)} registrado e enviado para a Planilha!`;state.paymentYear=ry;state.paymentMonth=rm;const sc=window.scrollY;render();window.scrollTo(0,sc);setTimeout(()=>{state.saveMessage="";const s=document.getElementById("payment-save-status");if(s)s.innerHTML=""},4000)}});
// ===== LOGIN COM GOOGLE =====
function loadDrivePhotos(){fetch(GOOGLE_SCRIPT_URL+"?action=photos").then(r=>r.json()).then(d=>{if(d&&d.ok&&d.photos){drivePhotos=d.photos;render()}}).catch(e=>console.warn("Fotos não carregadas:",e))}
function handleLogin(googleUser){const email=googleUser.email;loginStatus.innerHTML='<div class="login-loading">Verificando acesso...</div>';fetch(GOOGLE_SCRIPT_URL+"?action=login&email="+encodeURIComponent(email)).then(r=>r.json()).then(d=>{if(d&&d.status==="ok"){currentUser={email:email,nome:d.nome,nivel:d.nivel};localStorage.setItem("NODAN_SESSION",JSON.stringify(currentUser));loginScreen.hidden=true;app.hidden=false;render();loadDrivePhotos()}else{loginStatus.innerHTML=`<div class="login-error">Acesso negado. O e-mail <strong>${escapeHtml(email)}</strong> não está autorizado.</div>`}}).catch(e=>{loginStatus.innerHTML='<div class="login-error">Erro ao verificar acesso. Tente novamente.</div>'})}
function initLogin(){const saved=localStorage.getItem("NODAN_SESSION");if(saved){try{const s=JSON.parse(saved);if(s&&s.email&&s.nivel){currentUser=s;loginScreen.hidden=true;app.hidden=false;render();loadDrivePhotos();return}}catch(e){}}if(typeof google!=="undefined"&&google.accounts){google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:response=>{const payload=JSON.parse(atob(response.credential.split(".")[1]));handleLogin(payload)}});google.accounts.id.renderButton(document.getElementById("btn-google-login"),{theme:"outline",size:"large",width:280,text:"signin_with"})}else{setTimeout(initLogin,500)}}
initLogin();
</script>
</body>
</html>
